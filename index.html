<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Финансы">
<title>Финансы</title>
<style>
:root{
  --bg:#e6e4df; --card:#f2f0ec; --text:#24272d; --muted:#6c6f76; --border:#d3d0c9;
  --accent:#3b62c4; --pos:#2f7d4f; --neg:#b94141; --chip:#dcdfe8;
  --posbg:#d5e6da; --negbg:#eed9d6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa0a8; --border:#2a2d34; --chip:#1e2436;
    --accent:#5b8def; --pos:#4ade80; --neg:#f87171; --posbg:#16301f; --negbg:#361a1a;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa0a8; --border:#2a2d34; --chip:#1e2436;
  --accent:#5b8def; --pos:#4ade80; --neg:#f87171; --posbg:#16301f; --negbg:#361a1a;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
.wrap{max-width:760px;margin:0 auto;padding:16px;}
h1{font-size:19px;margin:4px 0 14px;display:flex;justify-content:space-between;align-items:center;}
#themeBtn{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:15px;cursor:pointer;color:var(--text);margin-left:8px;}
#status{font-size:11px;font-weight:400;color:var(--muted);cursor:pointer;}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.tab{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--card);font-size:13px;cursor:pointer;color:var(--muted);}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;}
.card .label{font-size:11px;color:var(--muted);margin-bottom:4px;}
.card .val{font-size:17px;font-weight:700;}
.pos{color:var(--pos);} .neg{color:var(--neg);}
.section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px;overflow-x:auto;}
.section h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:600;}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12.5px;}
.bar-name{width:110px;flex-shrink:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{flex:1;background:var(--chip);border-radius:6px;height:16px;overflow:hidden;}
.bar-fill{height:100%;background:var(--accent);border-radius:6px;}
.bar-val{width:70px;text-align:right;flex-shrink:0;}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;gap:8px;}
.list-item:last-child{border-bottom:none;}
.li-left{display:flex;flex-direction:column;min-width:0;flex:1;}
.li-cat{font-weight:600;}
.li-meta{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;}
.li-amt{font-weight:700;white-space:nowrap;}
.del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0 4px;}
form{display:grid;gap:8px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
input,select,textarea{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 10px;font-size:16px;width:100%;font-family:inherit;}
.typebtns{display:flex;gap:6px;}
.typebtn{flex:1;padding:9px;border-radius:10px;border:1px solid var(--border);background:var(--bg);text-align:center;cursor:pointer;font-size:13px;color:var(--muted);}
.typebtn.active.exp{background:var(--negbg);color:var(--neg);border-color:var(--neg);}
.typebtn.active.inc{background:var(--posbg);color:var(--pos);border-color:var(--pos);}
button.submit{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px;font-size:14px;cursor:pointer;font-weight:600;}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:16px 0;}
.filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.filters select{width:auto;font-size:14px;padding:6px 8px;}
</style>
</head>
<body>
<div class="wrap">
  <h1><span>💰 Мои финансы</span><span><span id="status" title="Нажмите, чтобы обновить">…</span><button id="themeBtn" title="Сменить тему">🌓</button></span></h1>
  <div class="tabs">
    <div class="tab active" data-tab="dash">Главная</div>
    <div class="tab" data-tab="add">Добавить</div>
    <div class="tab" data-tab="list">Операции</div>
  </div>
 
  <div id="dash">
    <div class="filters">
      <select id="periodSel">
        <option value="30">30 дней</option>
        <option value="7">7 дней</option>
        <option value="90">90 дней</option>
        <option value="all">Всё время</option>
      </select>
    </div>
    <div class="cards">
      <div class="card"><div class="label">Доход</div><div class="val pos" id="sumIncome">0 ₽</div></div>
      <div class="card"><div class="label">Расход</div><div class="val neg" id="sumExpense">0 ₽</div></div>
      <div class="card"><div class="label">Баланс</div><div class="val" id="sumNet">0 ₽</div></div>
    </div>
    <div class="section">
      <h2>Расходы по категориям</h2>
      <div id="catChart"><div class="empty">Пока нет данных</div></div>
    </div>
    <div class="section">
      <h2>Последние операции</h2>
      <div id="recentList"><div class="empty">Пока нет операций</div></div>
    </div>
  </div>
 
  <div id="add" style="display:none;">
    <div class="section">
      <form id="txForm">
        <div class="typebtns">
          <div class="typebtn active exp" data-type="expense">Расход</div>
          <div class="typebtn inc" data-type="income">Доход</div>
        </div>
        <input type="number" step="0.01" inputmode="decimal" id="fAmount" placeholder="Сумма, ₽" required>
        <div class="row2">
          <select id="fCategory"></select>
          <input type="date" id="fDate" required>
        </div>
        <textarea id="fComment" placeholder="Комментарий (необязательно)" rows="2"></textarea>
        <button class="submit" type="submit">Сохранить</button>
      </form>
    </div>
  </div>
 
  <div id="list" style="display:none;">
    <div class="section">
      <div class="filters">
        <select id="fltCat"><option value="">Все категории</option></select>
        <select id="fltType"><option value="">Всё</option><option value="expense">Расходы</option><option value="income">Доходы</option></select>
      </div>
      <div id="fullList"><div class="empty">Пока нет операций</div></div>
    </div>
  </div>
</div>
 
<script>
/* ========= НАСТРОЙКИ: впишите свои значения ========= */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLHWbdHrV8OnTMOGd4AoTfts_sngF9eIgd78JixmIgh_Keu-oslwC3zdXWRF_cCDPS7Q/exec"; // заканчивается на /exec
const SECRET     = "Osipenko126-6-4";                       // тот же, что в скрипте
/* ==================================================== */
 
const CATS = {
  expense: ["Продукты","Кафе/фастфуд","Транспорт","Развлечения","Подписки","Переводы","Здоровье","Покупки","Дом","Прочее"],
  income: ["Зарплата","Перевод","Кэшбэк","Возврат","Прочее"]
};
let txs = [], queue = [], curType = "expense", syncing = false;
 
/* ---- локальный кэш (быстрый старт и работа без сети) ---- */
function lsGet(k, def){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
txs = lsGet("fin_txs", []);
queue = lsGet("fin_queue", []);
 
function setStatus(t){ document.getElementById("status").textContent = t; }
const configured = () => SCRIPT_URL.startsWith("https://") && !SECRET.startsWith("ЗАМЕНИТЕ");
 
/* ---- обмен с Google Таблицей через Apps Script ---- */
async function apiGet(){
  const r = await fetch(SCRIPT_URL + "?key=" + encodeURIComponent(SECRET), { redirect: "follow" });
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || "error");
  return j.items;
}
async function apiPost(payload){
  // text/plain — чтобы браузер не делал preflight-запрос, который Apps Script не поддерживает
  const r = await fetch(SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ key: SECRET, ...payload }),
    redirect: "follow"
  });
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || "error");
}
 
async function sync(){
  if(syncing) return;
  if(!configured()){ setStatus("⚠️ не настроено"); return; }
  syncing = true; setStatus("⟳ синхронизация…");
  try{
    // 1) отправляем накопившиеся операции
    while(queue.length){
      await apiPost(queue[0]);
      queue.shift(); lsSet("fin_queue", queue);
    }
    // 2) скачиваем актуальную таблицу
    txs = await apiGet();
    lsSet("fin_txs", txs);
    setStatus("✓ синхронизировано");
  }catch(err){
    applyQueueLocally();
    setStatus("⚠️ нет связи" + (queue.length ? " (" + queue.length + " в очереди)" : ""));
  }
  syncing = false;
  render();
}
function applyQueueLocally(){
  queue.forEach(op=>{
    if(op.action==="add" && !txs.some(t=>t.id===op.tx.id)) txs.push(op.tx);
    if(op.action==="delete") txs = txs.filter(t=>t.id!==op.id);
  });
}
function enqueue(op){
  queue.push(op); lsSet("fin_queue", queue); lsSet("fin_txs", txs);
  sync();
}
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
 
/* ---- интерфейс ---- */
function fillCategorySelect(sel, list, withAll){
  sel.innerHTML = (withAll ? '<option value="">Все категории</option>' : '') +
    list.map(c=>`<option value="${c}">${c}</option>`).join("");
}
fillCategorySelect(document.getElementById("fCategory"), CATS.expense, false);
document.getElementById("fDate").value = new Date().toISOString().slice(0,10);
 
document.querySelectorAll(".typebtn").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll(".typebtn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    curType = b.dataset.type;
    fillCategorySelect(document.getElementById("fCategory"), CATS[curType], false);
  };
});
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    ["dash","add","list"].forEach(id=>document.getElementById(id).style.display = (id===t.dataset.tab?"block":"none"));
  };
});
 
function fmt(n){ return (Math.round(n*100)/100).toLocaleString("ru-RU") + " ₽"; }
function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
function periodCutoff(){
  const p = document.getElementById("periodSel").value;
  if(p === "all") return null;
  const d = new Date(); d.setDate(d.getDate() - parseInt(p));
  return d.toISOString().slice(0,10);
}
 
function render(){
  const cutoff = periodCutoff();
  const inPeriod = txs.filter(t => !cutoff || t.date >= cutoff);
  const income = inPeriod.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
  const expense = inPeriod.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
  document.getElementById("sumIncome").textContent = fmt(income);
  document.getElementById("sumExpense").textContent = fmt(expense);
  const netEl = document.getElementById("sumNet");
  netEl.textContent = fmt(income-expense);
  netEl.className = "val " + (income-expense>=0 ? "pos":"neg");
 
  const byCat = {};
  inPeriod.filter(t=>t.type==="expense").forEach(t=>{ byCat[t.category]=(byCat[t.category]||0)+t.amount; });
  const catEntries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const catChart = document.getElementById("catChart");
  if(catEntries.length===0){ catChart.innerHTML = '<div class="empty">Пока нет данных</div>'; }
  else{
    const max = catEntries[0][1];
    catChart.innerHTML = catEntries.map(([c,v])=>`
      <div class="bar-row">
        <div class="bar-name">${escapeHtml(c)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(4,v/max*100)}%"></div></div>
        <div class="bar-val">${fmt(v)}</div>
      </div>`).join("");
  }
 
  const sorted = a => [...a].sort((x,y)=> y.date.localeCompare(x.date) || (y.createdAt||0)-(x.createdAt||0));
  const recent = sorted(inPeriod).slice(0,8);
  document.getElementById("recentList").innerHTML = recent.length ? recent.map(txRow).join("") : '<div class="empty">Пока нет операций</div>';
 
  const fc = document.getElementById("fltCat").value;
  const ft = document.getElementById("fltType").value;
  let full = sorted(txs);
  if(fc) full = full.filter(t=>t.category===fc);
  if(ft) full = full.filter(t=>t.type===ft);
  document.getElementById("fullList").innerHTML = full.length ? full.map(txRow).join("") : '<div class="empty">Ничего не найдено</div>';
 
  const allCats = [...new Set(txs.map(t=>t.category))];
  const fltCatSel = document.getElementById("fltCat");
  const cur = fltCatSel.value;
  fillCategorySelect(fltCatSel, allCats, true);
  fltCatSel.value = cur;
}
 
function txRow(t){
  const sign = t.type==="income" ? "+" : "-";
  const cls = t.type==="income" ? "pos" : "neg";
  return `<div class="list-item">
    <div class="li-left">
      <div class="li-cat">${escapeHtml(t.category)}</div>
      <div class="li-meta">${t.date}${t.comment ? " · " + escapeHtml(t.comment) : ""}</div>
    </div>
    <div class="li-amt ${cls}">${sign}${fmt(t.amount)}</div>
    <button class="del" data-id="${t.id}" title="Удалить">✕</button>
  </div>`;
}
 
document.getElementById("periodSel").onchange = render;
document.getElementById("fltCat").onchange = render;
document.getElementById("fltType").onchange = render;
document.getElementById("status").onclick = sync;
 
document.addEventListener("click", (e)=>{
  if(e.target.classList.contains("del")){
    const id = e.target.dataset.id;
    txs = txs.filter(t=>t.id!==id);
    render();
    enqueue({ action:"delete", id });
  }
});
 
document.getElementById("txForm").onsubmit = (e)=>{
  e.preventDefault();
  const amount = parseFloat(document.getElementById("fAmount").value);
  if(!amount || amount<=0) return;
  const tx = {
    id: newId(),
    type: curType,
    amount: amount,
    category: document.getElementById("fCategory").value,
    date: document.getElementById("fDate").value,
    comment: document.getElementById("fComment").value.trim(),
    createdAt: Date.now()
  };
  txs.push(tx);
  render();
  e.target.reset();
  document.getElementById("fDate").value = new Date().toISOString().slice(0,10);
  fillCategorySelect(document.getElementById("fCategory"), CATS[curType], false);
  document.querySelector('.tab[data-tab="dash"]').click();
  enqueue({ action:"add", tx });
};
 
/* ---- тема: светлая / тёмная (по умолчанию как в системе), выбор запоминается ---- */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  document.getElementById("themeBtn").textContent = t === "dark" ? "☀️" : "🌙";
}
(function(){
  const saved = lsGet("fin_theme", null);
  applyTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
})();
document.getElementById("themeBtn").onclick = ()=>{
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next); lsSet("fin_theme", next);
};
 
/* ---- старт: сразу показываем кэш, затем тянем свежие данные из таблицы ---- */
render();
sync();
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) sync(); }); // обновление при возврате в приложение
setInterval(()=>{ if(!document.hidden) sync(); }, 60000);
</script>
</body>
</html>
